name: Frontend Visual Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Next.js
        run: npm run build
      - name: Start local Next server
        run: |
          npm run start -- -p 3000 > /tmp/opal-next.log 2>&1 &
          echo $! > /tmp/opal-next.pid
      - name: Validate screenshot utility syntax
        run: node --check scripts/capture-preview.mjs
      - name: Capture own frontend EN/AR screenshots
        run: npm run capture:preview
      - name: Show Next server output on failure
        if: failure()
        run: cat /tmp/opal-next.log || true
      - name: Upload frontend screenshots and DOM audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opal-frontend-preview
          path: artifacts/frontend-preview/
          if-no-files-found: warn
          retention-days: 14
