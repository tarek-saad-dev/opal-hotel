name: Poolside Feature Integration
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  feature-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPAL_BOOKING_ENABLED: "true"
      OPAL_AGENCY_ENABLED: "true"
      OPAL_AGENCY_PUBLIC_ORIGIN: http://127.0.0.1:3001
      OPAL_API_BASE_URL: http://127.0.0.1:8000
      OPAL_PAYMENT_GATEWAY: mock
      OPAL_TEST_FRONTEND: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run build
      - name: Start isolated frontend
        run: |
          npm run start -- -p 3001 > /tmp/poolside-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/en > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/test-poolside-flow.mjs
      - run: node scripts/test-agency-bff.mjs
      - if: failure()
        run: cat /tmp/poolside-next.log || true
