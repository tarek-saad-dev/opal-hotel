name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source integrity tests
        run: npm test
      - name: Reference validator tests
        run: node --test docs/reference-lock/capture/validate-reference.test.mjs
      - name: Capture syntax check
        run: node --check docs/reference-lock/capture/opal-capture.mjs
      - name: VPS deploy shell syntax
        run: |
          bash -n ops/deploy-vps.sh
          bash -n ops/prepare-poolside-release.sh
          bash -n ops/prepare-poolside-runtime.sh
      - name: Official media integrity (preview-safe)
        run: npm run media:check
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
