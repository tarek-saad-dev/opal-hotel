name: Reference Capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-capture.yml"
      - "docs/reference-lock/capture/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/reference-lock/capture
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install capture dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture EN/AR reference
        run: npm run capture
      - name: Save screenshots and computed-style audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opal-reference-capture
          path: docs/reference-lock/capture/output/
          if-no-files-found: warn
          retention-days: 14
